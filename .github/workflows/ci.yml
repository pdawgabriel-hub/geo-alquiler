# Integración continua de GeoAlquiler.
#
# - tests: en cada push y pull request. Restaura las versiones exactas de
#   renv.lock y ejecuta tests/testthat. Si falla, el commit queda en rojo.
# - despliegue: solo en push a main, si los tests han pasado y el repositorio
#   tiene los secretos SHINYAPPS_TOKEN y SHINYAPPS_SECRET (Settings > Secrets
#   and variables > Actions). Sin ellos el paso se salta y no da error, así
#   que se puede seguir desplegando a mano con Rscript scripts/deploy.R.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Misma versión de R que renv.lock
  R_VERSION: "4.3.3"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Librerías del sistema que necesitan sf, terra y arrow (geometría del
      # Observatorio y lectura de Parquet)
      - name: Instalar librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      # use-public-rspm descarga binarios precompilados de Posit Package
      # Manager en vez de compilar cada paquete desde el código fuente
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      # renv::restore() con caché entre ejecuciones
      - uses: r-lib/actions/setup-renv@v2

      - name: Ejecutar tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

  despliegue:
    name: Despliegue a shinyapps.io
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Evita dos despliegues a la vez si se hacen dos push seguidos
    concurrency: despliegue-shinyapps
    steps:
      - name: Comprobar credenciales
        id: credenciales
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          if [ -n "$SHINYAPPS_TOKEN" ] && [ -n "$SHINYAPPS_SECRET" ]; then
            echo "disponibles=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin secretos SHINYAPPS_TOKEN/SHINYAPPS_SECRET: se omite el despliegue."
          fi

      - uses: actions/checkout@v5
        if: steps.credenciales.outputs.disponibles == 'true'

      - name: Instalar librerías del sistema
        if: steps.credenciales.outputs.disponibles == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        if: steps.credenciales.outputs.disponibles == 'true'
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        if: steps.credenciales.outputs.disponibles == 'true'

      - name: Desplegar
        if: steps.credenciales.outputs.disponibles == 'true'
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(name = "pdawgabriel-hub", token = Sys.getenv("SHINYAPPS_TOKEN"), secret = Sys.getenv("SHINYAPPS_SECRET"))'
          Rscript scripts/deploy.R
